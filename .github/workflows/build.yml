name: Build AX6600

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker system prune -af || true
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld dwarves flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl ccache libelf-dev qemu-utils

      - name: Clone LibWrt
        run: |
          git clone --depth 1 --single-branch -b 25.12-nss https://github.com/LiBwrt/LibWrt.git openwrt
          echo "source $(cd openwrt && git rev-parse --short HEAD)"

      - name: Write config and files
        run: |
          cat > openwrt/.config << 'CFG'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_DEVEL=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_libbpf=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-dae=y
          CONFIG_PACKAGE_luci-i18n-dae-zh-cn=y
          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_luci-i18n-tailscale-community-zh-cn=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-openlist=y
          CONFIG_PACKAGE_luci-i18n-openlist-zh-cn=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn=y
          CONFIG_PACKAGE_ddns-go=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_luci-lib-docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_cgroupfs-mount=y
          CONFIG_PACKAGE_tini=y
          CONFIG_PACKAGE_kmod-ikconfig=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-nat6=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-dummy=y
          CONFIG_PACKAGE_kmod-fuse=y
          CONFIG_PACKAGE_luci-app-partexp=y
          CONFIG_PACKAGE_luci-i18n-partexp-zh-cn=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_luci-app-athena-led=y
          CONFIG_PACKAGE_athena-led=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_btrfs-progs=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CFG
          python3 - << 'PY'
          p="openwrt/.config"
          t=open(p).read()
          open(p,"w").write("\n".join(l.lstrip() for l in t.splitlines())+"\n")
          PY
          echo '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' >> openwrt/.config
          echo '# CONFIG_BPF_TOOLCHAIN_NONE is not set' >> openwrt/.config
          echo '# CONFIG_PACKAGE_luci-app-openclash is not set' >> openwrt/.config
          echo '# CONFIG_PACKAGE_luci-app-passwall is not set' >> openwrt/.config
          mkdir -p openwrt/files/etc/uci-defaults
          cat > openwrt/files/etc/uci-defaults/99-ax6600-custom << 'UCI'
          #!/bin/sh
          if [ -f /etc/config/dockerd ]; then
            uci -q set dockerd.globals.data_root='/mnt/mmcblk0p27/docker'
            uci -q commit dockerd
          fi
          if command -v devmem >/dev/null 2>&1; then
            devmem 0x1016000 32 0x201 >/dev/null 2>&1 || true
            devmem 0x1016004 32 0x2 >/dev/null 2>&1 || true
          fi
          exit 0
          UCI
          python3 - << 'PY'
          p="openwrt/files/etc/uci-defaults/99-ax6600-custom"
          open(p,"w").write("\n".join(l.lstrip() for l in open(p))+"\n")
          PY
          chmod +x openwrt/files/etc/uci-defaults/99-ax6600-custom

      - name: Extra packages
        working-directory: openwrt
        run: |
          git clone --depth 1 https://github.com/sirpdboy/luci-app-partexp.git package/luci-app-partexp
          git clone --depth 1 https://github.com/unraveloop/JDC-AX6600-Athena-LED-Controller.git /tmp/athena-led || true
          [ -d /tmp/athena-led/luci-app-athena-led ] && cp -a /tmp/athena-led/luci-app-athena-led package/
          [ -d /tmp/athena-led/athena-led ] && cp -a /tmp/athena-led/athena-led package/
          rm -rf /tmp/athena-led
          if [ ! -d feeds/luci/themes/luci-theme-argon ]; then
            git clone --depth 1 -b master https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon || true
          fi

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig
        working-directory: openwrt
        run: |
          make defconfig
          grep -E 'DEVICE_jdcloud_re-cs-02=y|DEBUG_INFO_BTF=y|XDP_SOCKETS=y|luci-app-(dae|homeproxy|ddns-go|openlist|dockerman|tailscale|partexp)=y' .config || true

      - name: Download
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -print -delete || true

      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect
        run: |
          mkdir -p out
          TARGET=openwrt/bin/targets/qualcommax/ipq60xx
          cp -v $TARGET/*.bin $TARGET/*.itb $TARGET/sha256sums $TARGET/*.buildinfo $TARGET/*.manifest out/ 2>/dev/null || true
          ls -lh out
          test -n "$(ls out/*sysupgrade.bin 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-ax6600-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6600-${{ github.run_number }}
          name: AX6600 ${{ github.run_number }}
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
