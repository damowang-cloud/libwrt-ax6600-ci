name: Build AX6600

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - "files/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: config/re-cs-02.config
  DIY_SH: scripts/diy.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker system prune -af || true
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld dwarves flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl ccache libelf-dev qemu-utils

      - name: Clone LibWrt
        run: |
          git clone --depth 1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          echo "source $(cd openwrt && git rev-parse --short HEAD)"

      - name: Copy files and DIY
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          [ -d files ] && cp -a files openwrt/files
          chmod +x "$DIY_SH"
          cd openwrt
          ../"$DIY_SH"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig
        working-directory: openwrt
        run: |
          make defconfig
          echo "===== enabled target / key packages ====="
          grep -E 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y|CONFIG_KERNEL_DEBUG_INFO_BTF=y|CONFIG_KERNEL_XDP_SOCKETS=y|CONFIG_PACKAGE_luci-app-(dae|homeproxy|ddns-go|openlist|dockerman|tailscale)' .config || true

      - name: Download
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -print -delete || true

      - name: Compile
        working-directory: openwrt
        run: |
          echo "$(nproc) threads"
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p out
          TARGET=openwrt/bin/targets/qualcommax/ipq60xx
          cp -v $TARGET/*.bin $TARGET/*.itb $TARGET/sha256sums $TARGET/*.buildinfo $TARGET/*.manifest out/ 2>/dev/null || true
          ls -lh out
          test -n "$(ls out/*sysupgrade.bin 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-ax6600-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6600-${{ github.run_number }}-${{ github.run_id }}
          name: AX6600 ${{ github.run_number }}
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
